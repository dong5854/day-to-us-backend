# Production Profile Configuration

# PostgreSQL Database Configuration
spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${PROD_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Import external properties
spring.config.import=optional:application-oauth.properties,optional:application-jwt.properties

# CORS Configuration
cors.allowed-origins=${PROD_CORS_ALLOWED_ORIGINS}

# OAuth Redirect URI
oauth2.redirect-uri=${PROD_OAUTH_REDIRECT_URI}

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email,https://www.googleapis.com/auth/calendar
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent

# JWT Configuration
jwt.secret-key=${JWT_SECRET_KEY}
jwt.expiration-time=${JWT_EXPIRATION_TIME}

# Token encryption key (Base64-encoded 256-bit AES key)
token.encryption.key=${TOKEN_ENCRYPTION_KEY}

# VAPID Keys for Web Push
vapid.public-key=${VAPID_PUBLIC_KEY}
vapid.private-key=${VAPID_PRIVATE_KEY}

# Proxy Configuration
# Handle X-Forwarded-* headers correctly (Essential for HTTPS behind a proxy)
server.forward-headers-strategy=native
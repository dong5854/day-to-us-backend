apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: day-to-us
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: day-to-us
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:16-alpine
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  umask 077
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  archive="/backup/daytous-${stamp}-${HOSTNAME}.dump"
                  partial="${archive}.partial"
                  trap 'rm -f "$partial"' EXIT
                  pg_dump --format=custom --no-owner --no-privileges --lock-wait-timeout=60s --file="$partial"
                  pg_restore --list "$partial" >/dev/null
                  mv "$partial" "$archive"
                  # Only expire completed archives after a new backup succeeds.
                  find /backup -maxdepth 1 -type f -name 'daytous-*.dump' -mtime +29 -delete
                  echo "Backup completed: $(basename "$archive") ($(wc -c < "$archive") bytes)"
              env:
                - name: PGHOST
                  value: db
                - name: PGDATABASE
                  value: daytous
                - name: PGCONNECT_TIMEOUT
                  value: "15"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: day-to-us-secret
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: day-to-us-secret
                      key: POSTGRES_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: postgres-backup-pvc
